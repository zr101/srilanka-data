name: pipeline
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  access-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.34.2
      - run: python scripts/probe_access.py
