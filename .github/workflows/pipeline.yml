name: pipeline

on:
  schedule:
    - cron: "30 5,11 * * *" # 11:00 & 17:00 Colombo — dailies publish ~5pm local
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: PYTHONPATH=src:. pytest -q
  scrape:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - cbsl_daily
          - tbill_auctions
          - pucsl_generation
          - nmra_registrations
          - wer
          - sltda_arrivals
          - edb_indicators
          - cbsl_weekly
          - forbes_tea
          - cbsl_prices
          - cbsl_activity
          - cbsl_monetary
          - cbsl_fiscal
          - cbsl_external
          - cbsl_financial
          - cbsl_price_report
    concurrency:
      group: pipeline-${{ matrix.dataset }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: data_${{ matrix.dataset }}
          path: data_checkout

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -r requirements.lock

      - name: Scrape
        id: scrape
        run: PYTHONPATH=src:. DATA_ROOT="$GITHUB_WORKSPACE/data_checkout" python -m pipeline.status ${{ matrix.dataset }}
        timeout-minutes: 10

      - name: Push data and collection status
        if: ${{ !cancelled() && steps.scrape.outcome != 'skipped' }}
        working-directory: data_checkout
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "🤖 ${{ matrix.dataset }} $(date -u +%Y-%m-%d-%H%M)"
          BRANCH=data_${{ matrix.dataset }}
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 8 attempts" >&2
          exit 1

      - name: Report persistent failures
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/report_failure.py ${{ matrix.dataset }}
